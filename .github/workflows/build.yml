name: Build Sega Genesis ROM

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Официальный рабочий образ SGDK с Docker Hub
      image: doragasu/gendev:v2.00

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ROM
        run: |
          make -f $GENDEV/sgdk/makefile.gen release

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryujin-den-genesis-rom
          path: |
            out/rom.bin
            out/symbol.txt
          if-no-files-found: error
