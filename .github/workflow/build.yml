name: Build Sega Genesis ROM

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/doragasu/docker-sgdk:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile ROM
        run: |
          make -f $GDK/makefile.gen release

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryujin-den-genesis-rom
          path: |
            out/rom.bin
            out/symbol.txt
          if-no-files-found: error
